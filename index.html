<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RIDE — Arcade Delivery</title>
<meta name="description" content="A fast, arcade-style 3D delivery driving game for your phone." />
<meta name="theme-color" content="#05070C" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="stylesheet" href="./style.css" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!-- Loading -->
  <div id="loading-screen" class="screen screen--loading">
    <div class="loading-card">
      <div class="loading-mark">RIDE</div>
      <div class="loading-bar"><div class="loading-bar__fill"></div></div>
      <p id="loading-label">Warming up the engine…</p>
    </div>
  </div>

  <!-- Main menu -->
  <div id="main-menu" class="screen hidden">
    <div class="menu-topbar">
      <div class="pill pill--money">🪙 <span id="main-menu-money">0</span></div>
      <button id="btn-install" class="pill pill--action hidden">Install app</button>
    </div>
    <div class="menu-hero">
      <h1 class="menu-title">RIDE</h1>
      <p class="menu-subtitle">Arcade deliveries. Real physics. Zero loading screens.</p>
    </div>
    <div class="menu-actions">
      <button id="btn-play" class="btn btn--primary btn--lg">Play</button>
      <button id="btn-garage" class="btn btn--ghost btn--lg">Garage</button>
      <button id="btn-settings" class="btn btn--ghost btn--lg">Settings</button>
    </div>
  </div>

  <!-- Mode select -->
  <div id="mode-select" class="screen hidden">
    <div class="panel">
      <h2>Choose a mode</h2>
      <div class="mode-grid">
        <button id="btn-freedrive" class="mode-card">
          <span class="mode-card__title">Free Drive</span>
          <span class="mode-card__desc">No timer. Cruise the city, collect coins, have fun.</span>
        </button>
        <button id="btn-delivery" class="mode-card">
          <span class="mode-card__title">Delivery</span>
          <span class="mode-card__desc">Pick up, drop off, beat the clock for up to 5 stars.</span>
        </button>
      </div>
      <button id="btn-mode-back" class="btn btn--ghost">Back</button>
    </div>
  </div>

  <!-- Garage -->
  <div id="garage-screen" class="screen hidden">
    <div class="panel panel--wide">
      <div class="panel-header">
        <h2>Garage</h2>
        <div class="pill pill--money">🪙 <span id="garage-money">0</span></div>
      </div>
      <div id="garage-car-list" class="car-list"></div>
      <div class="garage-footer">
        <button id="btn-repair" class="btn btn--accent">Repair car</button>
        <button id="btn-garage-back" class="btn btn--ghost">Back</button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-screen" class="screen hidden">
    <div class="panel">
      <h2>Settings</h2>
      <button id="btn-toggle-mute" class="btn btn--ghost btn--lg">Mute audio</button>
      <button id="btn-settings-back" class="btn btn--ghost">Back</button>
    </div>
  </div>

  <!-- In-game HUD -->
  <div id="hud-screen" class="screen hidden hud">
    <div class="hud-top-left">
      <div id="hud-health-panel" class="hud-panel">
        <span class="hud-label">Health</span>
        <div class="bar bar--health"><div id="hud-health-fill" class="bar__fill bar__fill--health"></div></div>
      </div>
      <div id="hud-mission-panel" class="hud-panel hidden">
        <span id="hud-mission-text" class="hud-label">Drive to the pickup point</span>
        <span id="hud-mission-timer" class="hud-timer">0s</span>
      </div>
    </div>

    <div class="hud-top-right">
      <div class="hud-top-right__row">
        <div class="pill pill--money">🪙 <span id="hud-money">0</span></div>
        <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
      </div>
      <div class="speedo">
        <span id="hud-speed">0</span>
        <span class="speedo__unit">km/h</span>
        <div class="bar bar--speed"><div id="hud-speed-fill" class="bar__fill bar__fill--speed"></div></div>
      </div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touch-controls" class="touch-controls hidden">
    <div id="joystick-base" class="joystick-base">
      <div id="joystick-nub" class="joystick-nub"></div>
    </div>
    <div class="pedal-cluster">
      <button id="btn-drift" class="pedal pedal--drift">DRIFT</button>
      <button id="btn-brake" class="pedal pedal--brake">BRAKE</button>
      <button id="btn-gas" class="pedal pedal--gas">GAS</button>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="pause-menu" class="screen hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button id="btn-resume" class="btn btn--primary btn--lg">Resume</button>
      <button id="btn-quit" class="btn btn--ghost btn--lg">Quit to menu</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Delivery result -->
  <div id="delivery-result" class="delivery-result">
    <div class="delivery-result__card">
      <div id="delivery-result-stars" class="delivery-result__stars"></div>
      <div id="delivery-result-reward" class="delivery-result__reward">+0 coins</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
